 const heading=pageHead('STUDY MODE',cat.name,`${currentLevel()} · ${state.mode==='review'?'오답 복습':'학습 중'}`,`<button class="back-link" data-action="quit">← 학습 설정</button>`);
 const prompts=(q.prompt||[]).map(x=>jp(x,q.hideKana&&!state.checked)).join('');
 const correct=q.options[q.answer],answeredCorrect=state.checked&&!state.usedReveal&&state.chosen===q.answer;
 const fb=state.checked?`<div class="feedback ${state.usedReveal?'':answeredCorrect?'good':'bad'}"><strong>${state.usedReveal?'정답을 공개했습니다.':answeredCorrect?'정답입니다!':'오답입니다. 이 표현을 다시 익혀 보세요.'}</strong><span class="tiny">올바른 정답 · ${'ABCD'[q.answer]}</span>${correct.text?`<div style="margin-top:10px;font-weight:800">${esc(correct.text)}</div>`:jp(correct)}
 ${q.solution?.k&&q.solution.j!==(correct.j||'')?jp(q.solution):''}</div>
 <div class="disclosures"><button class="btn secondary sm" data-action="explain">해설 ${state.explain?'접기':'보기'} ${state.explain?'⌃':'⌄'}</button><button class="btn secondary sm" data-action="translation">해석 ${state.translation?'접기':'보기'} ${state.translation?'⌃':'⌄'}</button></div>
 ${state.explain?`<div class="detail"><strong>문법·읽기 해설</strong>${nl(q.why)}</div>`:''}
 ${state.translation?`<div class="detail"><strong>한국어 해석</strong>${nl(q.translation||'')}${q.hideKana&&q.prompt?.length?`<hr class="divider">${q.prompt.map(x=>jp(x)).join('')}`:''}</div>`:''}
 <div class="btn-bar" style="margin-top:20px"><button class="btn flex" data-action="next">${state.sessionSize&&state.sessionCount>=state.sessionSize?'결과 보기':'다음 문제 →'}</button></div>`:'';
 return `${heading}<div class="panel quiz-panel">
 <div class="quiz-head"><div class="badges"><span class="badge">${esc(q.tag)}</span><span class="badge b2">${esc(q.kind)}</span></div><span class="tiny">${state.mode==='review'?'복습': '문제'} ${state.sessionCount+1}${state.sessionSize?' / '+state.sessionSize:' · ∞'}</span></div>
 <div class="progress" style="margin-top:18px"><div style="width:${pct}%"></div></div>
 <div class="prompt-title">${esc(q.title)}</div>${prompts?`<div class="quiz-context">${prompts}</div>`:''}
 <p class="tiny">가장 알맞은 답을 하나 선택하세요.</p><div class="answers">${answerOptions(q)}</div>
 ${!state.checked?`<div class="btn-bar"><button class="btn flex" data-action="submit" ${state.chosen<0?'disabled':''}>제출 · 채점</button><button class="btn outline" data-action="reveal">정답 보기</button></div><div class="tiny" style="margin-top:12px">보기를 선택해도 답은 공개되지 않습니다.</div>`:fb}
 </div>`;
}
function submit(reveal=false){const q=state.current;if(!q||state.checked||(!reveal&&state.chosen<0))return;
 state.checked=true;state.usedReveal=reveal;
 const success=!reveal&&state.chosen===q.answer;
 if(reveal)state.stats.revealed++;
 else {state.stats.answered++;if(success)state.stats.right++;}
 if(success)state.sessionRight++;
 if(state.mode==='review'){
  if(success)delete state.wrong[q.id];
 }else if(!success){
  state.wrong[q.id]={question:q,time:Date.now(),attempts:(state.wrong[q.id]?.attempts||0)+1};
 }
 save();render();
}
function next(){if(!state.checked)return;state.sessionCount++;
 if(state.sessionSize&&state.sessionCount>=state.sessionSize){state.current=null;state.view='results';save();render();window.scrollTo({top:0,behavior:'instant'});return;}
 if(state.mode==='review'){
  const arr=Object.values(state.wrong).filter(x=>x.question.category===state.category);
  if(!arr.length){state.current=null;state.view='results';save();render();return;}
  const chosen=arr[Math.floor(Math.random()*arr.length)];state.current=chosen.question;state.chosen=-1;state.checked=false;state.usedReveal=false;state.explain=false;state.translation=false;save();render();return;
 }
 advanceFresh();render();
}
function results(){const done=state.sessionCount,pct=done?Math.round(state.sessionRight/done*100):0;
 return `${pageHead('SESSION COMPLETED','이번 학습 결과','오답을 다시 익히거나 다른 카테고리를 선택할 수 있습니다.')}
 <div class="panel"><div class="grid cols3"><div class="stat-card"><div class="label">푼 문제</div><div class="value">${done}</div></div><div class="stat-card"><div class="label">정답</div><div class="value">${state.sessionRight}</div></div><div class="stat-card"><div class="label">이번 정답률</div><div class="value">${pct}%</div></div></div><div class="note" style="margin:22px 0">‘정답 보기’로 답을 공개한 문제는 정답으로 계산하지 않으며, 오답 복습 목록에 남습니다.</div><div class="btn-bar"><button class="btn" data-action="start">새로운 문제 계속 풀기 →</button><button class="btn secondary" data-nav="review">오답 복습</button><button class="btn outline" data-nav="home">홈으로</button></div></div>`;
}
function reviewPage(){const wrong=Object.values(state.wrong).sort((a,b)=>b.time-a.time);
 const render=wrong.slice(0,40).map(w=>`<div class="data-line"><div><div class="tiny">${esc(cats[w.question.category]?.name||'일본어')} · ${esc(w.question.kind)}</div><div style="font-size:14px;font-weight:750;margin-top:6px">${esc(w.question.title)}</div></div><span class="pill">다시 풀기</span></div>`).join('');
 return `${pageHead('MY REVIEW','오답 복습','틀렸거나 정답을 미리 본 문제는 다시 풀 수 있습니다.')}
 <div class="panel"><div class="split wrap"><h3>복습 대상 ${wrong.length}문제</h3>${wrong.length?'<button class="btn danger sm" data-action="clear-wrong">복습 목록 초기화</button>':''}</div>
 ${wrong.length?`<div class="btn-bar" style="margin:8px 0 15px">${Object.entries(cats).map(([k,v])=>`<button class="btn outline sm" data-review="${k}">${v.name} (${wrong.filter(x=>x.question.category===k).length})</button>`).join('')}</div><hr class="divider">${render}`:`<div class="empty-state">아직 복습 대상이 없습니다.<div style="margin-top:16px"><button class="btn" data-nav="home">학습 시작하기</button></div></div>`}</div>`;
}
function startReview(cat){const all=Object.values(state.wrong).filter(x=>x.question.category===cat);if(!all.length){window.alert('이 카테고리에는 복습할 문제가 없습니다.');return;}
 state.category=cat;state.view='quiz';state.mode='review';state.sessionCount=0;state.sessionRight=0;state.sessionSize=0;state.current=all[Math.floor(Math.random()*all.length)].question;state.chosen=-1;state.checked=false;state.explain=false;state.translation=false;state.usedReveal=false;save();render();
}
function tablePage(){const part=state.tablePos,groups={verb:'동사',i:'い형용사',na:'な형용사'};
 let words=[...FORMS_DATA[part==='verb'?'verbs':part]],added=state.custom.filter(w=>w.pos===part);words.push(...added);
 let chosen=words.find(x=>x.id===state.tableId)||words[0];if(!chosen){return '<div class="panel">단어 목록이 비어 있습니다.</div>';}
 let formData=E.getForms(chosen,'N1');const table=formData.map(x=>`<tr><td><strong style="font-size:13px">${esc(x.name)}</strong></td><td>${jp(x.value,true,true)}<div class="kana" lang="ja">${esc(x.value.k)}</div></td></tr>`).join('');
 return `${pageHead('CONJUGATION REFERENCE','형태 변형표','기본형을 선택하면 사전형부터 고급 활용까지 한눈에 확인할 수 있습니다.')}
 <div class="panel"><label class="select-label">품사</label><div class="segmented">${Object.entries(groups).map(([id,t])=>`<button data-table-part="${id}" class="${part===id?'active':''}">${t}</button>`).join('')}</div>
 <div class="settings-grid"><div><label class="select-label" for="word-picker">단어 선택</label><select id="word-picker" class="form-control" data-field="table-word">${words.map(w=>`<option value="${esc(w.id)}" ${chosen.id===w.id?'selected':''}>${esc(w.j)} — ${esc(w.meaning)}</option>`).join('')}</select></div>
 <div><label class="select-label">기본형</label>${jp({j:chosen.j,k:chosen.k,ko:chosen.meaning})}</div></div><hr class="divider"><div class="note" style="margin-bottom:14px">${esc(E.formRule(chosen,'te'))}</div><div style="overflow-x:auto"><table class="form-table"><thead><tr><th>활용 형태</th><th>일본어 · 히라가나</th></tr></thead><tbody>${table}</tbody></table></div></div>`;
}
function library(){const filter=state.libraryFilter||'',all=E.studyWords(state.custom),listed=all.filter(w=>[w.j,w.k,w.ko,w.theme].join(' ').toLowerCase().includes(filter.toLowerCase())).slice(0,75);
 return `${pageHead('MY STUDY MATERIALS','일본어 수업 자료','제공된 Lesson 1~14와 날짜별 수업의 주요 어휘·상황을 정리했습니다.')}
 <div class="panel"><h3>수업에서 다룬 주제</h3><div class="row-wrap" style="margin-bottom:16px">${['자기소개·지시어','소유·장소·존재','시간·날짜·수량','교통·이동·여행','취향·능력·이유','요청·진행형','회식·직장','편의점·쇼핑','가족·육아','형용사·비교','동사 활용','자동차·시험'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><p class="sub">원본 수업 자료의 핵심 어휘와 관련 표현을 선별해 학습용으로 구성했습니다. 교정이 필요한 학생 문장은 정답으로 그대로 사용하지 않았습니다.</p>
 <hr class="divider"><div class="split wrap"><h3>학습 어휘 (${all.length}개)</h3><span class="tiny">내가 추가한 단어 ${state.custom.length}개 포함</span></div><div class="search-box"><input class="form-control" id="lib-search" value="${esc(filter)}" placeholder="단어, 뜻, 주제 검색" aria-label="어휘 검색"><button class="btn secondary sm" data-action="lib-search">검색</button></div>
 ${listed.length?listed.map(w=>`<div class="data-line"><div>${jp({j:w.j,k:w.k,ko:w.ko})}</div><span class="pill">${esc(w.theme)}</span></div>`).join(''):'<div class="empty-state">검색 결과가 없습니다.</div>'}</div>`;
}
function settings(){return `${pageHead('BACKUP & VOCABULARY','학습 자료 관리','새로운 수업 표현을 입력하거나 학습 기록을 무료로 백업할 수 있습니다.')}
 <div class="panel"><h3>새 수업 단어 추가</h3><p class="sub">각 줄에 <strong>일본어 | 히라가나 | 한국어 뜻 | 주제 | N4 | 품사</strong> 형식으로 입력하세요. 마지막 품사는 일반 어휘는 생략하고, 활용형에 넣으려면 <strong>동사1 / 동사2 / 동사3 / い형용사 / な형용사</strong> 중 하나를 입력합니다.</p>
 <textarea id="user-words" class="dataArea" placeholder="乾燥する | かんそうする | 건조하다 | 날씨 | N3 | 동사3&#10;連絡する | れんらくする | 연락하다 | 회사 | N4 | 동사3&#10;快適 | かいてき | 쾌적하다 | 날씨 | N3 | な형용사" spellcheck="false"></textarea>
 <div class="btn-bar" style="margin-top:14px"><button class="btn" data-action="add-words">단어 추가</button><button class="btn outline" data-nav="library">단어장 보기</button></div>
 <div id="word-message" class="tiny" style="margin-top:12px"></div><hr class="divider">
 <h3>기기별 기록 백업</h3><div class="callout"><span style="font-size:20px">☁</span><div>학습 데이터는 계정이 아니라 <strong>현재 브라우저의 저장 공간</strong>에 보관합니다. 다른 기기로 옮기거나 브라우저 데이터를 지우기 전에는 JSON 파일을 내려받아 보관하세요.</div></div>
 <div class="btn-bar" style="margin-top:17px"><button class="btn secondary" data-action="export">JSON 백업 다운로드</button><button class="btn outline" data-action="import">기존 백업 불러오기</button><input id="import-file" type="file" accept="application/json,.json" hidden><button class="btn danger" data-action="reset">학습 기록 초기화</button></div>${state.backupAlert?`<div class="note" style="margin-top:12px">${esc(state.backupAlert)}</div>`:''}</div>`;
}
function render(){
 const nav=(state.view==='quiz'||state.view==='setup'||state.view==='results')?state.category:state.view;
 $$('[data-nav]').forEach(el=>el.classList.toggle('is-current',el.dataset.nav===nav));
 const wrong=$('#wrong-badge');if(wrong)wrong.textContent=gradeCount();
 const names={home:'학습 홈',setup:cats[state.category].name,quiz:cats[state.category].name,results:'이번 학습 결과',review:'오답 복습',tables:'활용표',library:'수업 자료',settings:'자료·백업'};
 const c=$('#crumb');if(c)c.innerHTML=`ことば LAB <span>/</span> ${esc(names[state.view]||'학습 홈')}`;
 const score=$('#top-score');if(score)score.textContent=`정답률 ${statPct()}%`;
 try{
  $('#app').innerHTML=({home,setup,quiz,results,review:reviewPage,tables:tablePage,library,settings}[state.view]||home)();
 }catch(e){console.error('Rendering failed',e);$('#app').innerHTML=`<div class="panel"><h3>화면을 표시하지 못했습니다.</h3><p class="sub">${esc(e.message)}</p><button class="btn" data-nav="home" style="margin-top:15px">홈으로</button></div>`;}
}
function addWords(){const area=$('#user-words');if(!area)return;const lines=area.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 let n=0,errors=[];
 for(const line of lines){const x=line.split('|').map(y=>y.trim());if(x.length<3||x.slice(0,3).some(z=>!z)){errors.push(line);continue;}
  const [j,k,ko,theme='내 수업',level='N4',part='']=x;
  if(state.custom.some(y=>y.j===j&&y.k===k)){continue;}
  const lv=level.match(/^N([1-5])$/i)?Number(level.slice(1)):4;
  let pos='',group=0;
  if(part==='동사1'){pos='verb';group=1;}else if(part==='동사2'){pos='verb';group=2;}else if(part==='동사3'){pos='verb';group=3;}else if(part==='い형용사')pos='i';else if(part==='な형용사')pos='na';
  const item={id:'u'+Date.now()+'-'+n,j,k,ko,meaning:ko,theme,level:lv,pos,group};
  if(pos==='verb'&&((group===1&&!/[うくぐすつぬぶむる]$/.test(k))||(group===2&&!k.endsWith('る'))||(group===3&&!k.endsWith('する')&&j!=='来る'))){errors.push(line);continue;}
  if(pos==='i'&&!k.endsWith('い')){errors.push(line);continue;}
  state.custom.push(item);n++;
 }
 state.backupAlert=`${n}개 단어를 추가했습니다.${errors.length?` ${errors.length}개 줄은 형식을 확인해 주세요.`:''}`;save();render();}
function exportData(){const payload={version:3,exportedAt:new Date().toISOString(),data:{levels:state.levels,topics:state.topics,progress:state.progress,seen:state.seen,wrong:state.wrong,custom:state.custom,stats:state.stats,seed:state.seed}};
 const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='kotoba_lab_backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
 state.backupAlert='백업 파일을 생성했습니다.';save();render();}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{
  const payload=JSON.parse(reader.result);if(payload.version!==3||!payload.data||!Array.isArray(payload.data.custom))throw Error('호환되지 않는 형식');
  if(!window.confirm('현재 학습 기록을 백업 내용으로 바꾸시겠습니까?'))return;
  const data=payload.data;for(const k of ['levels','topics','progress','seen','wrong','custom','stats','seed'])if(data[k]!==undefined)state[k]=data[k];
  state.custom=state.custom.slice(0,5000);state.current=null;state.view='home';state.backupAlert='백업을 가져왔습니다.';save();render();
 }catch(e){window.alert('올바른 ことば LAB 백업 파일이 아닙니다: '+e.message);}};reader.readAsText(file);}
function reset(){if(!window.confirm('모든 정답률·오답·학습 단어 데이터를 초기화할까요?'))return;const oldView=state.view;state=JSON.parse(JSON.stringify(defaults));state.view=oldView==='settings'?'settings':'home';save();render();}
function handleClick(e){
 const el=e.target.closest('button,[data-nav]');if(!el)return;
 if(el.dataset.nav){const dest=el.dataset.nav;if(dest==='home'||['review','tables','library','settings'].includes(dest))changePage(dest);else openCategory(dest);return;}
 if(el.dataset.category){openCategory(el.dataset.category);return;}
 if(el.dataset.level){state.levels[state.category]=el.dataset.level;save();render();return;}
 if(el.dataset.topic!==undefined){state.topics[state.category]=el.dataset.topic;save();render();return;}
 if(el.dataset.size!==undefined){state.sessionSize=Number(el.dataset.size);save();render();return;}
 if(el.dataset.select!==undefined){if(state.checked)return;state.chosen=Number(el.dataset.select);save();render();return;}
 if(el.dataset.tablePart){state.tablePos=el.dataset.tablePart;state.tableId=FORMS_DATA[state.tablePos==='verb'?'verbs':state.tablePos][0]?.id;save();render();return;}
 if(el.dataset.review){startReview(el.dataset.review);return;}
 const action=el.dataset.action;
 switch(action){
 case 'open-category':openCategory(el.dataset.category);break;
 case 'start':start();break;
 case 'quit':state.current=null;state.mode='normal';changePage('setup');break;
 case 'submit':submit(false);break;
 case 'reveal':submit(true);break;
 case 'explain':state.explain=!state.explain;save();render();break;
 case 'translation':state.translation=!state.translation;save();render();break;
 case 'next':next();break;
 case 'clear-wrong':if(window.confirm('오답 기록을 모두 지울까요?')){state.wrong={};save();render();}break;
 case 'lib-search':state.libraryFilter=$('#lib-search')?.value||'';save();render();break;
 case 'add-words':addWords();break;
 case 'export':exportData();break;
 case 'import':$('#import-file')?.click();break;
 case 'reset':reset();break;
 }
}
document.addEventListener('click',handleClick);
document.addEventListener('change',e=>{
 const f=e.target.dataset.field;
 if(f==='topic'){state.topics[state.category]=e.target.value;save();}
 if(f==='table-word'){state.tableId=e.target.value;save();render();}
 if(e.target.id==='import-file')importData(e.target.files[0]);
});
document.addEventListener('keydown',e=>{
 if(state.view==='quiz'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
  if(['1','2','3','4'].includes(e.key)&&!state.checked){state.chosen=Number(e.key)-1;save();render();}
  if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();state.checked?next():submit(false);}
 }
 if(state.view==='library'&&e.key==='Enter'&&e.target.id==='lib-search'){state.libraryFilter=e.target.value;save();render();}
});
render();
window.KotobaApp={state:()=>state,render,start,openCategory,submit,next};
})();

</script>
</body>
</html>
